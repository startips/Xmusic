name: Build UI Test APK (arm64-v8a)

on:
  push:
    branches:
      - ui-test
  workflow_dispatch:

concurrency:
  group: ui-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build arm64-v8a Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build arm64-v8a APK (debug keystore)
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PMYAPP_UPLOAD_STORE_FILE=debug.keystore \
            -PMYAPP_UPLOAD_STORE_PASSWORD=android \
            -PMYAPP_UPLOAD_KEY_ALIAS=androiddebugkey \
            -PMYAPP_UPLOAD_KEY_PASSWORD=android

      - name: Verify APK
        shell: bash
        run: |
          ls -lh android/app/build/outputs/apk/release/xmusic-*-arm64-v8a.apk
          md5sum android/app/build/outputs/apk/release/xmusic-*-arm64-v8a.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmusic-ui-test-arm64-v8a
          path: android/app/build/outputs/apk/release/xmusic-*-arm64-v8a.apk
          retention-days: 7
          if-no-files-found: error
